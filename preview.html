<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>MW05 UI catalog preview</title>
  <link rel="stylesheet" href="/MW05BeamNG/ui/modules/apps/MW05VehicleHUD/app.css">
  <link rel="stylesheet" href="/MW05BeamNG/ui/modules/apps/MW05ForcedInduction/app.css">
  <link rel="stylesheet" href="/MW05BeamNG/ui/modules/apps/MW05OilPressure/app.css">
  <link rel="stylesheet" href="/MW05BeamNG/ui/modules/apps/MW05AFR/app.css">
  <link rel="stylesheet" href="/MW05BeamNG/ui/modules/apps/MW05Minimap/app.css">
  <style>
    @font-face { font-family: "MW05Digital"; src: url("/preview-assets/Segment7Standard.otf") format("opentype"); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #111; color: #eee; font-family: Arial, sans-serif; }
    body { padding: 24px; }
    header { max-width: 1040px; margin: 0 auto 18px; border: 1px solid #454841; padding: 14px 18px; background: #181a18; }
    header h1 { margin: 0; font-size: 18px; letter-spacing: 2px; text-transform: uppercase; }
    header p { margin: 6px 0 0; color: #a9aaa5; font-size: 12px; }
    .catalog { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(320px, 481px)); gap: 22px; justify-content: center; }
    .card { border: 1px solid #3e413c; background: #171917; padding: 10px; overflow: hidden; }
    .card h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 1.5px; color: #d4d5ce; text-transform: uppercase; }
    .stage { width: 481px; height: 481px; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 35%, #575c52 0%, #252a26 60%, #111 100%); }
    .stage > .mw05-vehicle-hud, .stage > .mw05-forced-induction, .stage > .mw05-oil-pressure { width: 100%; height: 100%; }
    .stage .mw05-hud-svg, .stage .mw05-boost-svg, .stage .mw05-oil-svg { width: 100%; height: 100%; }
    .gauge-stage { background: radial-gradient(circle at 45% 35%, #4a4d46 0%, #252722 58%, #10110f 100%); }
    .afr-stage { width: 481px; height: 481px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #4b5049, #1c201c); }
    .afr-stage .mw05-afr { width: 220px; height: 120px; }
    .minimap-stage { width: 300px; height: 300px; margin: 0 auto; background: #10120f; display: flex; align-items: center; justify-content: center; }
    .map-surface { position: absolute; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #292b2b; box-shadow: inset 0 0 0 7px #171919; }
    .map-surface svg { width: 100%; height: 100%; opacity: .95; }
    .map-road { fill: none; stroke: #0c0d0d; stroke-width: 19; stroke-linecap: round; stroke-linejoin: round; }
    .map-road-inner { fill: none; stroke: #777b77; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    .map-road-minor { fill: none; stroke: #050606; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    .map-player { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 34px solid #f4a34c; transform: translate(-50%, -58%); filter: drop-shadow(0 0 3px #111); }
    .mw05-nos-preview { fill: none; stroke: #4aa8ff; stroke-width: 6; stroke-linecap: butt; }
    .map-north { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); color: #eee; font: 800 18px Arial; text-shadow: 0 2px 3px #000; }
    .minimap-stage .mw05-minimap-app { width: 100%; height: 100%; }
    .minimap-stage .mw05-minimap-frame { width: 100%; height: 100%; z-index: 4; }
    .minimap-stage .mw05-minimap-frame::before, .minimap-stage .mw05-minimap-frame::after { z-index: 5; }
    body.single-preview { padding: 0; background: #111; }
    body.single-preview header { display: none; }
    body.single-preview .catalog { display: block; margin: 0; }
    body.single-preview .card { display: none; padding: 0; border: 0; }
    body.single-preview .card[data-preview="hud"], body.single-preview .card[data-preview="boost"], body.single-preview .card[data-preview="oil"], body.single-preview .card[data-preview="afr"], body.single-preview .card[data-preview="map"] { display: block; }
    body.single-preview .card h2 { display: none; }
    body.single-preview .stage { margin: 0; }
    @media (max-width: 1050px) { .catalog { grid-template-columns: 481px; } }
  </style>
</head>
<body>
  <header><h1>MW05 UI Apps</h1><p>Aperçu rendu avec les mêmes SVG et feuilles de style que les applications BeamNG.</p></header>
  <main class="catalog">
    <section class="card" data-preview="hud"><h2>MW05 Vehicle HUD</h2><div class="stage" id="hud-stage"></div></section>
    <section class="card" data-preview="boost"><h2>MW05 Forced Induction</h2><div class="stage gauge-stage" id="boost-stage"></div></section>
    <section class="card" data-preview="oil"><h2>MW05 Oil Pressure</h2><div class="stage gauge-stage" id="oil-stage"></div></section>
    <section class="card" data-preview="afr"><h2>MW05 AFR</h2><div class="stage afr-stage" id="afr-stage"></div></section>
    <section class="card" data-preview="map"><h2>MW05 Minimap</h2><div class="stage minimap-stage" id="map-stage"></div></section>
  </main>
  <script>
    const P = (angle, radius) => { const r = angle * Math.PI / 180; return { x: 256 + Math.sin(r) * radius, y: 256 - Math.cos(r) * radius }; };
    const arc = (start, end, radius) => { const a = P(start, radius), b = P(end, radius); return `M ${a.x.toFixed(2)} ${a.y.toFixed(2)} A ${radius} ${radius} 0 ${Math.abs(end-start)>180?1:0} ${end>=start?1:0} ${b.x.toFixed(2)} ${b.y.toFixed(2)}`; };
    const band = (start, end, outer, inner) => { const os=P(start,outer), oe=P(end,outer), ie=P(end,inner), is=P(start,inner); return `M ${os.x.toFixed(2)} ${os.y.toFixed(2)} A ${outer} ${outer} 0 0 1 ${oe.x.toFixed(2)} ${oe.y.toFixed(2)} L ${ie.x.toFixed(2)} ${ie.y.toFixed(2)} A ${inner} ${inner} 0 0 0 ${is.x.toFixed(2)} ${is.y.toFixed(2)} Z`; };
    const ticks = (start, end, count, majorEvery, cls) => Array.from({length: count + 1}, (_, i) => { const a = start + i / count * (end - start); const major = i % majorEvery === 0; return `<line class="${major ? cls + '-major-tick' : ''}" x1="256" y1="52" x2="256" y2="${major ? 80 : 70}" transform="rotate(${a} 256 256)"/>`; }).join('');
    const defs = id => `<defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
    const numberLabels = (values, angleOf, radius) => values.map(v => { const p = P(angleOf(v), radius); return `<text x="${p.x.toFixed(2)}" y="${p.y.toFixed(2)}">${v}</text>`; }).join('');
    const hud = () => {
      const tickHtml = ticks(-130, 130, 40, 4, 'mw05-major-tick');
      const numberHtml = numberLabels(Array.from({length: 11}, (_, i) => i), v => -130 + v / 10 * 260, 164);
      return `<div class="mw05-vehicle-hud"><svg class="mw05-hud-svg" viewBox="0 0 512 512">${defs('previewHudGlow')}<circle class="mw05-hud-shadow" cx="256" cy="256" r="225"/><circle class="mw05-hud-face" cx="256" cy="256" r="216" fill="#151515" fill-opacity=".76"/><path class="mw05-redline" d="${band(86,130,215,187)}"/><path class="mw05-nos-arc-track" d="${arc(105,180,240)}"/><path class="mw05-nos-preview" d="${arc(105,180,240)}"/><path class="mw05-fuel-arc-fill" d="${arc(-130,-28,226)}"/><path class="mw05-temp-arc-fill" d="${arc(28,130,226)}"/><g class="mw05-ticks">${tickHtml}</g><g class="mw05-numbers">${numberHtml}</g><g class="mw05-gear-panel"><rect x="214" y="146" width="84" height="48" rx="9"/><text class="mw05-gear-ghost" x="266" y="175">8</text><text class="mw05-gear-value" x="266" y="175">4</text><path class="mw05-shift-indicator" d="M230 157.45 L220 180.55 L240 180.55 Z"/></g><g class="mw05-status-icons"><g class="mw05-status-icon" transform="translate(164.5 285)"><circle class="mw05-status-icon-shape" cx="21" cy="21" r="14" fill="none"/><text x="21" y="25" text-anchor="middle" font-size="9" fill="#dfdfdb">ABS</text></g><g class="mw05-status-icon" transform="translate(211.5 285)"><text class="mw05-status-icon-shape" x="21" y="26" text-anchor="middle" font-size="23">◖</text></g><g class="mw05-status-icon mw05-status-active" transform="translate(258.5 285)"><path class="mw05-status-icon-shape" d="M 7.6,6.3 L 7.6,8.5 L 10.8,8.5 L 10.8,12 L 10.8,15.5 L 7.6,15.5 L 7.6,17.7 L 0.5,12 Z"/><path class="mw05-status-icon-shape" d="M 16.4,6.3 L 16.4,8.5 L 13.2,8.5 L 13.2,12 L 13.2,15.5 L 16.4,15.5 L 16.4,17.7 L 23.5,12 Z"/></g><g class="mw05-status-icon mw05-status-active" transform="translate(305.5 285)"><text class="mw05-status-icon-shape" x="21" y="26" text-anchor="middle" font-size="22">Ⓟ</text></g></g><g class="mw05-needle" style="transform:rotate(-40deg)"><rect x="0" y="0" width="512" height="512" fill="transparent"/><path d="M256 256 L250 256 L256 78 L262 256 Z"/><circle cx="256" cy="256" r="15"/><circle class="mw05-pivot" cx="256" cy="256" r="7"/></g><g class="mw05-speed-panel"><rect x="150" y="315" width="212" height="67" rx="11"/><text class="mw05-speed-ghost" x="256" y="365">888</text><text class="mw05-speed-value" x="256" y="365">187</text></g><text class="mw05-unit" x="256" y="409">KM/H</text><g class="mw05-bottle"><path d="M42 423h20v10c0 4 5 7 5 13v42c0 6-4 10-10 10H36c-6 0-10-4-10-10v-42c0-6 5-9 5-13v-10z"/><path d="M29 423h26"/><path class="mw05-bolt" d="M47 442l-10 22h10l-7 19 18-27H48z"/></g><g class="mw05-temp"><text x="408" y="91">🌡</text></g><g class="mw05-clock-mark"><path d="M431 20h28v39h-28z"/><circle cx="445" cy="38" r="10"/><path d="M445 38l7-6"/></g></svg></div>`;
    };
    const boost = () => {
      const min = -15, max = 36, zero = -90, start = -130, end = 130;
      const angle = v => v <= 0 ? start + (v-min)/(0-min)*(zero-start) : zero + v/max*(end-zero);
      const tickHtml = Array.from({length: 26}, (_, i) => { const v = -14 + i*2; const major = v >= 0 && v % 10 === 0; return `<line class="${major?'mw05-boost-major-tick':''}" x1="256" y1="52" x2="256" y2="${major?80:70}" transform="rotate(${angle(v)} 256 256)"/>`; }).join('');
      const valueLabels = [-15, 0, 5, 10, 15, 20, 25, 30, 35].map(v => { const p=P(angle(v),154); return `<text x="${p.x.toFixed(2)}" y="${p.y.toFixed(2)}">${v}</text>`; }).join('');
      return `<div class="mw05-forced-induction"><svg class="mw05-boost-svg" viewBox="0 0 512 512">${defs('previewBoostGlow')}<circle class="mw05-boost-shadow" cx="256" cy="256" r="225"/><circle class="mw05-boost-face" cx="256" cy="256" r="216"/><path class="mw05-boost-redline" d="${band(angle(31.7),end,215,187)}"/><path class="mw05-boost-track" d="${arc(start,end,207)}"/><g class="mw05-boost-ticks">${tickHtml}</g><g class="mw05-boost-numbers">${valueLabels}</g><g class="mw05-boost-needle" style="transform:rotate(${angle(18)}deg)"><rect x="0" y="0" width="512" height="512" fill="transparent"/><path d="M256 256 L250 256 L256 78 L262 256 Z"/><circle cx="256" cy="256" r="15"/><circle class="mw05-boost-pivot" cx="256" cy="256" r="7"/></g><image class="mw05-boost-preview-icon" href="/preview-assets/turbo.svg" x="232" y="274" width="48" height="48" preserveAspectRatio="xMidYMid meet"/><g class="mw05-boost-readout" transform="translate(0 30)"><g class="mw05-boost-panel"><rect x="191" y="315" width="130" height="67" rx="11"/><text class="mw05-boost-ghost" x="256" y="358.5">888</text><text class="mw05-boost-value" x="292" y="358.5">18</text></g><text class="mw05-boost-unit" x="256" y="409">PSI</text></g></svg></div>`;
    };
    const oil = () => {
      const tickHtml = ticks(-130,130,30,6,'mw05-oil-major-tick');
      const valueLabels = [0,20,40,60,80,100].map(v => { const p=P(-130+v/100*260,154); return `<text x="${p.x.toFixed(2)}" y="${p.y.toFixed(2)}">${v}</text>`; }).join('');
      return `<div class="mw05-oil-pressure"><svg class="mw05-oil-svg" viewBox="0 0 512 512">${defs('previewOilGlow')}<circle class="mw05-oil-shadow" cx="256" cy="256" r="225"/><circle class="mw05-oil-face" cx="256" cy="256" r="216"/><path class="mw05-oil-redline" d="${band(114.4,130,215,187)}"/><path class="mw05-oil-track" d="${arc(-130,130,207)}"/><g class="mw05-oil-ticks">${tickHtml}</g><g class="mw05-oil-numbers">${valueLabels}</g><g class="mw05-oil-needle" style="transform:rotate(5.2deg)"><rect x="0" y="0" width="512" height="512" fill="transparent"/><path d="M256 256 L250 256 L256 78 L262 256 Z"/><circle cx="256" cy="256" r="15"/><circle class="mw05-oil-pivot" cx="256" cy="256" r="7"/></g><image class="mw05-oil-icon" href="/preview-assets/oilPressureIndicator.svg" x="232" y="274" width="48" height="48" preserveAspectRatio="xMidYMid meet"/><g class="mw05-oil-readout" transform="translate(0 30)"><g class="mw05-oil-panel"><rect x="191" y="315" width="130" height="67" rx="11"/><text class="mw05-oil-ghost" x="256" y="358.5">888</text><text class="mw05-oil-value" x="292" y="358.5">52</text></g><text class="mw05-oil-unit" x="256" y="409">PSI</text></g></svg></div>`;
    };
    const afr = () => `<div class="mw05-afr"><div class="mw05-afr-panel" style="--mw05-afr-number-size:59px;--mw05-afr-unit-size:20px"><div class="mw05-afr-value"><span class="mw05-afr-ghost">88.8</span><span class="mw05-afr-number">14.7</span></div><div class="mw05-afr-unit">AFR</div></div></div>`;
    const minimap = () => `<div class="mw05-minimap-app"><div class="map-surface"><svg viewBox="0 0 300 300"><path class="map-road" d="M-20 225 C50 205 62 125 132 142 S208 245 325 196"/><path class="map-road-inner" d="M-20 225 C50 205 62 125 132 142 S208 245 325 196"/><path class="map-road" d="M170 -20 C156 52 190 76 160 132 S88 190 111 320"/><path class="map-road-inner" d="M170 -20 C156 52 190 76 160 132 S88 190 111 320"/><path class="map-road-minor" d="M-10 75 C54 90 93 83 135 40 S232 42 322 91"/><path class="map-road-minor" d="M240 -10 C220 56 261 119 298 160"/></svg><div class="map-north">N</div><div class="map-player"></div></div><div class="mw05-minimap-frame"></div></div>`;
    document.getElementById('hud-stage').innerHTML = hud();
    document.getElementById('boost-stage').innerHTML = boost();
    document.getElementById('oil-stage').innerHTML = oil();
    document.getElementById('afr-stage').innerHTML = afr();
    document.getElementById('map-stage').innerHTML = minimap();
    const only = new URLSearchParams(location.search).get('app');
    if (only) { document.body.classList.add('single-preview'); document.querySelectorAll('.card').forEach(card => { if (card.dataset.preview !== only) card.style.display = 'none'; }); }
  </script>
</body>
</html>
